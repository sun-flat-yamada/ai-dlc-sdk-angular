name: ✨ Feature request
description: Propose an improvement to the AI-DLC SDK
title: '[Feature]: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today? Which phase (inputs, loop, gates, reverse docs, QCD)?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Behaviour, configuration and input format changes you have in mind.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
