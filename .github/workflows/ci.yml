name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Every step runs inside the AI-DLC sandbox (.devcontainer): the same image, egress firewall and
    # sandbox checks as a local or agent run. The runner only checks out the repository.
    name: Quality gate in the sandbox (app + harness + E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Build the sandbox and run every check inside it
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            set -euo pipefail
            echo "::group::Sandbox check (container, egress firewall, credential bridges)"
            npm run aidlc:sandbox-check
            echo "::endgroup::"
            echo "::group::Format check";              npm run format:check;    echo "::endgroup::"
            echo "::group::Secret & privacy scan";     npm run secret-scan;     echo "::endgroup::"
            echo "::group::Typecheck";                 npm run typecheck;       echo "::endgroup::"
            echo "::group::Lint";                      npm run lint;            echo "::endgroup::"
            echo "::group::Unit tests with coverage";  npm run test:coverage;   echo "::endgroup::"
            echo "::group::Harness tests";             npm run tools:test;      echo "::endgroup::"
            echo "::group::Build";                     npm run build;           echo "::endgroup::"
            echo "::group::Gate 0 — validate sample inputs"
            npm run aidlc:parse-excel
            npm run aidlc:validate-inputs
            echo "::endgroup::"
            echo "::group::Harness dry-run (3 iterations, no Copilot call)"
            npm run aidlc:run -- --max-iterations 3 --dry-run
            echo "::endgroup::"
            echo "::group::E2E smoke (Playwright, Chromium baked into the image)"
            npm run e2e
            echo "::endgroup::"

      - name: Upload harness reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aidlc-dry-run-reports
          path: |
            .ai-dlc/outputs/reports/
            .ai-dlc/outputs/reverse-docs/
            .ai-dlc/outputs/telemetry/run-history.json
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
